<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Title Here</title>
    <style>
        /* CSS variables */
        :root {
            --main-bg-color: #f0f0f0;
            --main-text-color: #333;
            --accent-color: #0056b3;
        }

        body {
            background-color: var(--main-bg-color);
            color: var(--main-text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: var(--accent-color);
        }

        /* Example of a media query */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            h1 {
                font-size: 24px;
            }
        }

        /* Example of an animation */
        .fade {
            animation: fadeIn 2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Additional CSS styles from hazel.css would go here */
    </style>
</head>
<body>
    <h1>Welcome to My Website</h1>
    <p>This is a sample HTML file with embedded CSS.</p>
</body>
</html>
